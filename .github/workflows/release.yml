# สร้างไฟล์ติดตั้งมะลิ (Android / Mac / Windows) แล้วแนบใน GitHub Release อัตโนมัติ
# วิธีใช้: สร้างแท็กเวอร์ชัน เช่น  git tag v1.0.0 && git push origin v1.0.0
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'เวอร์ชัน เช่น v1.0.1', required: true }

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MALI_VERSION: ${{ env.VERSION }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mali.p12"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/mali.p12"
          fi
          gradle -p apps/android assembleRelease --no-daemon
          APK=$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out && cp "$APK" "out/Mali-${VERSION#v}-android.apk"
          rm -f "$RUNNER_TEMP/mali.p12"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  desktop:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: --mac }
          - { os: windows-latest, target: --win }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: apps/desktop, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Build installer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }   # ยังไม่มีใบรับรองนักพัฒนา จึงไม่เซ็นแอป
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then git tag "$VERSION" && git push origin "$VERSION"; fi
          gh release create "$VERSION" files/* --title "มะลิ $VERSION" --notes-file .github/release-notes.md || gh release upload "$VERSION" files/* --clobber
