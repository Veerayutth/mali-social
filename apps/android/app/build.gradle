// แอป Android ของมะลิ: Trusted Web Activity เปิดเว็บแอปเต็มจอผ่าน Chrome ของเครื่อง
// (กล้อง ไมค์ อัปโหลดไฟล์ การแจ้งเตือน และการทำงานออฟไลน์ ใช้ได้เหมือนเปิดใน Chrome)
plugins { id 'com.android.application' }

def appUrl = System.getenv('MALI_URL') ?: 'https://mali-social-6be0.netlify.app'
def appHost = new URL(appUrl).host
def ver = (System.getenv('MALI_VERSION') ?: '1.0.0').replaceFirst(/^v/, '')
def parts = ver.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }
def code = parts[0] * 10000 + (parts.size() > 1 ? parts[1] : 0) * 100 + (parts.size() > 2 ? parts[2] : 0)

android {
    namespace 'app.mali.social'
    compileSdk 35
    defaultConfig {
        applicationId 'app.mali.social'
        minSdk 24
        targetSdk 35
        versionCode code
        versionName ver
        manifestPlaceholders = [hostName: appHost, defaultUrl: appUrl]
        resValue 'string', 'app_name', 'มะลิ'
    }
    signingConfigs {
        release {
            // กุญแจเซ็นแอปมาจาก GitHub Secrets (ไม่อยู่ในโค้ด) ถ้าไม่มีจะสร้าง APK แบบ debug แทน
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'mali'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
